name: QA // Release

on:
  push:
    branches:
      - "1.x"
      - "2.x"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    name: QA
    uses: QuingKhaos/khaosci/.github/workflows/qa.yml@2d2ad15a401bf43d8f458d18f1f9f810ba9209dd

  release:
    name: Release mod
    uses: QuingKhaos/khaosci/.github/workflows/release.yml@e92ac4ea7b780401945fc37895ddaefb946693d9
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore(release):')) || github.event_name == 'workflow_dispatch'
    needs: [qa]
    with:
      lfs: false
      mod-folder: .
      skip-update-details: ${{ github.ref_name != '1.x' }}
    secrets:
      factorio-api-key: ${{ secrets.FACTORIO_API_KEY }}
