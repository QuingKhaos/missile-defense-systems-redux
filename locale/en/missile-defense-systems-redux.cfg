[item-description]
mds-ballistic-missile=A banded cartridge of ten unguided artillery-style missiles for the Ballistic missile defense system - one cartridge is one full barrage. The missiles ignore trees and rocks in flight so they reliably reach extreme range, but trade precision for a wide barrage spread.
mds-ballistic-chemical-missile=A banded cartridge of ten unguided artillery-style chemical missiles for the Ballistic missile defense system - one cartridge is one full barrage. The missiles ignore trees and rocks in flight so they reliably reach extreme range, but trade precision for a wide barrage spread.
mds-ballistic-explosive-missile=A banded cartridge of ten unguided artillery-style explosive missiles for the Ballistic missile defense system - one cartridge is one full barrage. The missiles ignore trees and rocks in flight so they reliably reach extreme range, but trade precision for a wide barrage spread.
mds-ballistic-incendiary-missile=A banded cartridge of ten unguided artillery-style incendiary missiles for the Ballistic missile defense system - one cartridge is one full barrage. The missiles ignore trees and rocks in flight so they reliably reach extreme range, but trade precision for a wide barrage spread.
mds-ballistic-tungsten-missile=A banded cartridge of ten unguided artillery-style tungsten missiles for the Ballistic missile defense system - one cartridge is one full barrage. The missiles ignore trees and rocks in flight so they reliably reach extreme range, but trade precision for a wide barrage spread.
mds-ballistic-targeting-remote=Orders a Ballistic missile barrage on the targeted position. Only Ballistic missile defense systems respond - and only if the target is inside their range. Each responding launcher fires its full barrage at the mark, then reloads.

[modifier-description]
mds-ballistic-missile-damage-bonus=Ballistic missile damage: +__1__
mds-ballistic-missile-shooting-speed-bonus=Ballistic missile shooting speed: +__1__

[technology-description]
basic-missile-defense-system=A stationary missile launching platform equipped with a basic targeting processor. It has a relatively short range but a good bit of fire rate. However it is lacking any kind of safety mechanism. Ordnance will be unloaded onto the closest target irrespective of self sustained damage.
advanced-missile-defense-system=The natural evolution of missile defense systems. It is equipped with a sophisticated targeting processor, enabling the platform to reach much greater firing range. Its safety features include a minimum targeting range to avoid friendly fire and a slower firing rate with increased loading capacity.
ballistic-missile-defense-system=The final evolution of the missile defense systems. Thanks to its rocket guiding system, it is capable of targeting and brutally eliminating any opposition from extreme range. Thanks to this, it is safe to shoot even the most destructive types of missiles. Its range however comes at the cost of less flexible shooting angle.

