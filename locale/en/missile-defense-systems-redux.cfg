[item-name]
basic-missile-defense-system=Basic missile defense system
advanced-missile-defense-system=Advanced missile defense system

[technology-description]
basic-missile-defense-system=A stationary missile launching platform equipped with a basic targeting processor. It has a relatively short range but a good bit of fire rate. However it is lacking any kind of safety mechanism. Ordnance will be unloaded onto the closest target irrespective of self sustained damage.
advanced-missile-defense-system=The natural evolution of missile defense systems. It is equipped with a sophisticated targeting processor, enabling the platform to reach much greater firing range. Its safety features include a minimum targeting range to avoid friendly fire and a slower firing rate with increased loading capacity.

[mod-setting-name]
mds-basic-fire-pattern=[color=yellow][font=heading-2]Basic[/font][/color] Fire pattern
mds-basic-fire-arc-degree=[color=yellow][font=heading-2]Basic[/font][/color] Fire arc degree
mds-basic-fire-rate=[color=yellow][font=heading-2]Basic[/font][/color] Fire rate
mds-basic-min-range=[color=yellow][font=heading-2]Basic[/font][/color] Min range
mds-basic-max-range=[color=yellow][font=heading-2]Basic[/font][/color] Max range

mds-advanced-fire-pattern=[color=orange][font=heading-2]Advanced[/font][/color] Fire pattern
mds-advanced-fire-arc-degree=[color=orange][font=heading-2]Advanced[/font][/color] Fire arc degree
mds-advanced-fire-rate=[color=orange][font=heading-2]Advanced[/font][/color] Fire rate
mds-advanced-min-range=[color=orange][font=heading-2]Advanced[/font][/color] Min range
mds-advanced-max-range=[color=orange][font=heading-2]Advanced[/font][/color] Max range

[mod-setting-description]
mds-basic-fire-pattern=The shape of area where the basic turret will attack targets.
mds-basic-fire-arc-degree=The angle of the arc where the basic turret will attack targets. Only used if 'Fire pattern' is 'Arc'.
mds-basic-fire-rate=The number of time the basic turret shoot per second (per 60 frames)
mds-basic-min-range=The minimum range of the basic turret in tile count.
mds-basic-max-range=The maximum range of the basic turret in tile count.

mds-advanced-fire-pattern=The shape of area where the advanced turret will attack targets.
mds-advanced-fire-arc-degree=The angle of the arc where the advanced turret will attack targets. Only used if 'Fire pattern' is 'Arc'.
mds-advanced-fire-rate=The number of time the advanced turret shoot per second (per 60 frames)
mds-advanced-min-range=The minimum range of the advanced turret in tile count.
mds-advanced-max-range=The maximum range of the advanced turret in tile count.

[string-mod-setting]
mds-basic-fire-pattern-arc=Arc
mds-basic-fire-pattern-circle=Circle
mds-advanced-fire-pattern-arc=Arc
mds-advanced-fire-pattern-circle=Circle

[string-mod-setting-description]
mds-basic-fire-pattern-arc=The basic turret will fire on targets in front of it in an arc shaped area.
mds-basic-fire-pattern-circle=The basic turret will fire on targets around it in a circle shaped area.
mds-advanced-fire-pattern-arc=The advanced turret will fire on targets in front of it in an arc shaped area.
mds-advanced-fire-pattern-circle=The advanced turret will fire on targets around it in a circle shaped area.

[mod-name]
missile-defense-systems-redux=Missile Defense Systems Redux

[mod-description]
missile-defense-systems-redux=Missile Defense Systems adds three tiers of missile-firing defensive turrets: Basic, Advanced, and Ballistic - an end-game rapid-fire artillery launcher.
